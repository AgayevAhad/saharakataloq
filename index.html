<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <link rel="icon" type="image/png" href="/media/SaharaLogo.png" />
    <meta name="description" content="Sahara Electronic rəsmi məhsul kataloqu. Məişət texnikası modelləri, təsdiqlənmiş xüsusiyyətlər və birbaşa WhatsApp əlaqəsi." />
    
    <!-- OpenGraph / Social Sharing Preview -->
    <meta property="og:title" content="Sahara Electronic – Məhsul Kataloqu" />
    <meta property="og:description" content="Məişət texnikası modelləri, texniki xüsusiyyətlər və Sahara Electronic dəstəyi." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="az_AZ" />

    <title>Sahara Electronic – Rəsmi Məhsul Kataloqu</title>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      
      html, body, #root {
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
        background-color: #0b0d13;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0d1117;
      }
      ::-webkit-scrollbar-thumb {
        background: #232936;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b4252;
      }

      /* Print / PDF generation styles */
      @media print {
        body {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
