<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <link rel="icon" type="image/png" href="/media/SaharaLogo.png" />
    <meta name="description" content="Sahara Electronic rəsmi məhsul kataloqu. Məişət texnikası modelləri, təsdiqlənmiş xüsusiyyətlər və birbaşa WhatsApp əlaqəsi." />
    
    <!-- OpenGraph / Social Sharing Preview -->
    <meta property="og:title" content="Sahara Electronic – Məhsul Kataloqu" />
    <meta property="og:description" content="Məişət texnikası modelləri, texniki xüsusiyyətlər və Sahara Electronic dəstəyi." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="az_AZ" />

    <title>Sahara Electronic – Rəsmi Məhsul Kataloqu</title>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script>
      // Immediate theme synchronization before first paint to prevent flashes
      (function() {
        try {
          var saved = localStorage.getItem('sahara_theme_mode');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add('theme-' + theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#0d0f14' : '#f8fafc');
          }
        } catch(e) {}
      })();
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Light Mode Default Variables and Base (Default Catalog Experience) */
      :root {
        --splash-bg: radial-gradient(circle at 50% 38%, #ffffff 0%, #f8fafc 55%, #e2e8f0 100%);
        --splash-body-bg: #f8fafc;
        --splash-body-color: #0f172a;
        --splash-glow: radial-gradient(circle, rgba(220, 38, 38, 0.12) 0%, rgba(245, 158, 11, 0.06) 45%, rgba(220, 38, 38, 0) 70%);
        --splash-logo-bg: #ffffff;
        --splash-logo-border: rgba(226, 232, 240, 0.95);
        --splash-logo-shadow: 0 16px 36px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(220, 38, 38, 0.06), inset 0 1px 0 rgba(255, 255, 255, 1);
        --splash-brand-text: linear-gradient(135deg, #0f172a 30%, #334155 100%);
        --splash-brand-color: #0f172a;
        --splash-tagline: #64748b;
        --splash-loader-track: rgba(15, 23, 42, 0.08);
        --splash-bar-glow: rgba(220, 38, 38, 0.45);
        --splash-hint: #64748b;
        --splash-ring-top: rgba(220, 38, 38, 0.85);
        --splash-ring-right: rgba(245, 158, 11, 0.7);
        --scrollbar-track: #f1f5f9;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-thumb-hover: #94a3b8;
      }

      /* Dark Mode Overrides */
      html[data-theme="dark"], html.theme-dark {
        --splash-bg: radial-gradient(circle at 50% 40%, #151a27 0%, #080a0f 100%);
        --splash-body-bg: #0b0d13;
        --splash-body-color: #f1f5f9;
        --splash-glow: radial-gradient(circle, rgba(220, 38, 38, 0.18) 0%, rgba(220, 38, 38, 0) 70%);
        --splash-logo-bg: rgba(255, 255, 255, 0.04);
        --splash-logo-border: rgba(255, 255, 255, 0.12);
        --splash-logo-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        --splash-brand-text: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
        --splash-brand-color: #ffffff;
        --splash-tagline: #94a3b8;
        --splash-loader-track: rgba(255, 255, 255, 0.08);
        --splash-bar-glow: rgba(220, 38, 38, 0.8);
        --splash-hint: #64748b;
        --splash-ring-top: rgba(220, 38, 38, 0.7);
        --splash-ring-right: rgba(245, 158, 11, 0.5);
        --scrollbar-track: #0d1117;
        --scrollbar-thumb: #232936;
        --scrollbar-thumb-hover: #3b4252;
      }
      
      html, body, #root {
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
        max-width: 100%;
        background-color: var(--splash-body-bg);
        color: var(--splash-body-color);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden !important;
        scroll-behavior: smooth;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* Sahara Premium Splash Screen */
      .sahara-splash-container {
        position: fixed;
        inset: 0;
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        background: var(--splash-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
        overflow: hidden;
        user-select: none;
      }

      .sahara-splash-container.splash-fade-out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
        visibility: hidden;
      }

      .sahara-splash-glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: var(--splash-glow);
        filter: blur(40px);
        animation: splashGlowPulse 2.8s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .sahara-splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        max-width: 360px;
        z-index: 2;
      }

      .sahara-splash-logo-wrap {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        background: var(--splash-logo-bg);
        border: 1px solid var(--splash-logo-border);
        border-radius: 28px;
        box-shadow: var(--splash-logo-shadow);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: splashLogoFloat 3s ease-in-out infinite alternate;
      }

      .sahara-splash-logo {
        width: 78px;
        height: 78px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.12));
      }

      html[data-theme="dark"] .sahara-splash-logo,
      html.theme-dark .sahara-splash-logo {
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      }

      .sahara-splash-ring {
        position: absolute;
        inset: -6px;
        border-radius: 34px;
        border: 1.5px solid transparent;
        border-top-color: var(--splash-ring-top);
        border-right-color: var(--splash-ring-right);
        animation: splashRingRotate 3.5s linear infinite;
      }

      .sahara-splash-text {
        margin-bottom: 24px;
      }

      .sahara-splash-brand {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--splash-brand-color);
        margin-bottom: 6px;
        background: var(--splash-brand-text);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .sahara-splash-tagline {
        font-size: 12px;
        font-weight: 500;
        color: var(--splash-tagline);
        letter-spacing: 0.04em;
      }

      .sahara-splash-loader {
        width: 160px;
        height: 3px;
        background: var(--splash-loader-track);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
        position: relative;
      }

      .sahara-splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #dc2626, #f59e0b);
        border-radius: 999px;
        box-shadow: 0 0 10px var(--splash-bar-glow);
        animation: splashBarProgress 1.4s ease-in-out infinite alternate;
      }

      .sahara-splash-hint {
        font-size: 11px;
        color: var(--splash-hint);
        font-weight: 400;
        animation: splashHintPulse 1.8s ease-in-out infinite;
      }

      @keyframes splashGlowPulse {
        0% { transform: scale(0.9); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }

      @keyframes splashLogoFloat {
        0% { transform: translateY(0); }
        100% { transform: translateY(-5px); }
      }

      @keyframes splashRingRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes splashBarProgress {
        0% { left: 0%; width: 25%; }
        50% { width: 55%; }
        100% { left: 75%; width: 25%; }
      }

      @keyframes splashHintPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Print / PDF generation styles */
      @media print {
        body {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .no-print, .sahara-splash-container {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Sahara Premium Splash & Brand Launch Screen -->
    <div id="app-splash-screen" class="sahara-splash-container" aria-hidden="true">
      <div class="sahara-splash-glow"></div>
      <div class="sahara-splash-content">
        <div class="sahara-splash-logo-wrap">
          <img src="/media/SaharaLogo.png" alt="Sahara Electronics" class="sahara-splash-logo" />
          <div class="sahara-splash-ring"></div>
        </div>
        <div class="sahara-splash-text">
          <h1 class="sahara-splash-brand">SAHARA ELECTRONICS</h1>
          <p class="sahara-splash-tagline">Rəsmi Məhsul Kataloqu</p>
        </div>
        <div class="sahara-splash-loader">
          <div class="sahara-splash-bar"></div>
        </div>
        <span class="sahara-splash-hint">Kataloq modelləri hazırlanır...</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback timer to guarantee splash dismissal
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('app-splash-screen');
          if (splash && !splash.classList.contains('splash-fade-out')) {
            splash.classList.add('splash-fade-out');
            setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 550);
          }
        }, 3000);
      });
    </script>
  </body>
</html>
