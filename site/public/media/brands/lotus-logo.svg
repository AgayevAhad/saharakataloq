    <!-- T -->
    <path d="M42 2 L57 2 L57 6.5 L52.2 6.5 L52.2 26.5 L46.8 26.5 L46.8 6.5 L42 6.5 Z"/>
    <!-- U -->
    <path d="M59 2 L64.5 2 L64.5 17 C64.5 21, 67 23, 70 23 C73 23, 75.5 21, 75.5 17 L75.5 2 L81 2 L81 17 C81 23.5, 76.5 27.5, 70 27.5 C63.5 27.5, 59 23.5, 59 17 Z"/>
    <!-- S -->
    <path d="M84.5 21 L89.5 20.5 C90 22.5, 92 23.5, 95 23.5 C98 23.5, 99.5 22, 99.5 20.2 C99.5 18.5, 98 17.5, 93.5 16.5 C88 15, 85 13, 85 8.5 C85 4, 89 1.5, 94.5 1.5 C100 1.5, 104 4.5, 104.5 9 L99.5 9.5 C99 7.5, 97.5 6, 94.5 6 C92 6, 90.5 7, 90.5 8.5 C90.5 10, 92 10.8, 96 11.8 C102 13.2, 105 15.5, 105 19.8 C105 24.5, 100.5 27.5, 95 27.5 C88.5 27.5, 85 24.5, 84.5 21 Z"/>
