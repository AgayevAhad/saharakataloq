<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 50" fill="none">
  <!-- Lotus Iconic Flower Emblem & Modern Wordmark -->
  <defs>
    <linearGradient id="lotusPetalMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="lotusPetalSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
  </defs>
  
  <!-- Flower Emblem -->
  <g transform="translate(6, 5)">
    <!-- Center petal -->
    <path d="M22 4 C27 10, 29 18, 22 28 C15 18, 17 10, 22 4 Z" fill="url(#lotusPetalMain)"/>
    <!-- Left inner petal -->
    <path d="M11 11 C18 12, 22 17, 21 26 C13 24, 9 19, 11 11 Z" fill="url(#lotusPetalSide)"/>
    <!-- Right inner petal -->
    <path d="M33 11 C35 19, 31 24, 23 26 C22 17, 26 12, 33 11 Z" fill="url(#lotusPetalSide)"/>
    <!-- Outer base petals -->
    <path d="M4 21 C12 19, 18 22, 21 30 C12 31, 7 28, 4 21 Z" fill="#9333EA" opacity="0.85"/>
    <path d="M40 21 C37 28, 32 31, 23 30 C26 22, 32 19, 40 21 Z" fill="#9333EA" opacity="0.85"/>
    <!-- Bottom curve -->
    <path d="M9 34 C18 38, 26 38, 35 34" stroke="#7E22CE" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Stylized Modern LOTUS Wordmark -->
  <g fill="#7E22CE" transform="translate(56, 12)">
    <!-- L -->
    <path d="M0 2 L5.5 2 L5.5 22 L15.5 22 L15.5 26.5 L0 26.5 Z"/>
